name: Cashier Tarsnap Compression Hunt

on:
  push:
    branches: [cashier-tarsnap-lab]
  workflow_dispatch:

jobs:
  compression-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang autoconf automake autoconf-archive pkg-config \
            libssl-dev zlib1g-dev libext2fs-dev libbz2-dev liblzma-dev libacl1-dev libattr1-dev
      - name: Build Tarsnap with ASan and UBSan
        run: |
          git clone --depth=1 https://github.com/Tarsnap/tarsnap.git tarsnap-src
          cd tarsnap-src
          autoreconf -i
          CC=clang CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' ./configure --disable-dependency-tracking
          make -j2
      - name: Build all-filter parser harness
        working-directory: tarsnap-src
        run: |
          cat >/tmp/filter_harness.c <<'EOF'
          #include <stdio.h>
          #include "archive.h"
          #include "archive_entry.h"
          int main(int argc, char **argv) {
            struct archive *a; struct archive_entry *e = NULL; int r;
            char buf[32768];
            if (argc != 2) return 2;
            a = archive_read_new();
            if (!a) return 2;
            archive_read_support_compression_all(a);
            archive_read_support_format_all(a);
            r = archive_read_open_filename(a, argv[1], 10240);
            if (r != ARCHIVE_OK) { archive_read_finish(a); return 0; }
            for (;;) {
              r = archive_read_next_header(a, &e);
              if (r == ARCHIVE_EOF) break;
              if (r < ARCHIVE_WARN) break;
              for (;;) {
                r = (int)archive_read_data(a, buf, sizeof(buf));
                if (r <= 0) break;
              }
              if (r < 0) break;
            }
            archive_read_finish(a);
            return 0;
          }
          EOF
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ilibarchive /tmp/filter_harness.c libarchive/libarchive.a \
            -lz -lbz2 -llzma -o /tmp/filter_harness
      - name: Generate structured compressed corpus and hunt sanitizer faults
        run: |
          cat >/tmp/compression_hunt.py <<'PY'
          import bz2, gzip, lzma, os, pathlib, random, shutil, struct, subprocess, tarfile, io

          ROOT=pathlib.Path('/tmp/compression-corpus'); ROOT.mkdir(exist_ok=True)
          HITS=pathlib.Path('/tmp/compression-hits'); HITS.mkdir(exist_ok=True)
          # deterministic tiny valid TAR payload
          bio=io.BytesIO()
          with tarfile.open(fileobj=bio, mode='w') as tf:
            data=b'cashier-compression-probe\n'
            ti=tarfile.TarInfo('x.txt'); ti.size=len(data); ti.mtime=0
            tf.addfile(ti, io.BytesIO(data))
          tar=bio.getvalue()

          seeds={
            'gzip': gzip.compress(tar, compresslevel=9, mtime=0),
            'bzip2': bz2.compress(tar, compresslevel=9),
            'xz': lzma.compress(tar, format=lzma.FORMAT_XZ),
            'lzma': lzma.compress(tar, format=lzma.FORMAT_ALONE),
          }

          cases=[]
          def add(name,data): cases.append((name,bytes(data)))
          for kind,s in seeds.items():
            add(kind+'-valid',s)
            # Every short truncation around header and trailer boundaries.
            for n in sorted(set(list(range(0,min(40,len(s)))) + [max(0,len(s)-i) for i in range(0,33)])):
              add(f'{kind}-trunc-{n}',s[:n])
            # Concatenated streams and junk boundaries.
            add(kind+'-concat2',s+s)
            add(kind+'-prefix-junk',b'JUNK'+s)
            add(kind+'-suffix-junk',s+b'JUNK')

          # Valid gzip streams carrying FEXTRA; old Tarsnap parser has suspicious length arithmetic.
          gz=seeds['gzip']; basehdr=bytearray(gz[:10]); basehdr[3] |= 0x04
          rawdeflate=gz[10:-8]; trailer=gz[-8:]
          for n in [0,1,2,3,4,8,16,255,1024,65535]:
            extra=bytes((i*131+17)&255 for i in range(n))
            g=bytes(basehdr)+struct.pack('<H',n)+extra+rawdeflate+trailer
            add(f'gzip-fextra-{n}',g)
            if n:
              add(f'gzip-fextra-{n}-trunc-extra',bytes(basehdr)+struct.pack('<H',n)+extra[:-1])
          # FNAME/FCOMMENT and combined optional fields.
          for flag,part,label in [(8,b'A'*8192+b'\0','fname'),(16,b'B'*8192+b'\0','comment')]:
            h=bytearray(gz[:10]); h[3] |= flag
            add('gzip-'+label,bytes(h)+part+rawdeflate+trailer)
          h=bytearray(gz[:10]); h[3] |= 4|8|16|2
          extra=b'XY'
          add('gzip-all-optionals',bytes(h)+struct.pack('<H',2)+extra+b'n\0'+b'c\0'+b'\x00\x00'+rawdeflate+trailer)

          rnd=random.Random(0xB0A17E)
          for kind,s in seeds.items():
            for i in range(650):
              b=bytearray(s)
              mode=rnd.randrange(7)
              if mode==0 and b:
                for _ in range(rnd.randint(1,6)):
                  j=rnd.randrange(len(b)); b[j]^=1<<rnd.randrange(8)
              elif mode==1 and b:
                j=rnd.randrange(len(b)); del b[j:j+rnd.randint(1,min(24,len(b)-j))]
              elif mode==2:
                j=rnd.randrange(len(b)+1); b[j:j]=os.urandom(rnd.randint(1,16))
              elif mode==3 and b:
                j=rnd.randrange(len(b)); b[j:j+rnd.randint(1,min(24,len(b)-j))]=b'\x00'*rnd.randint(1,24)
              elif mode==4 and len(b)>12:
                j=rnd.randrange(4,len(b)-4); b[j:j+4]=rnd.choice([b'\xff'*4,b'\x00'*4,b'\x7f\xff\xff\xff'])
              elif mode==5:
                b += bytes(rnd.randrange(256) for _ in range(rnd.randint(1,32)))
              else:
                if len(b)>8:
                  b=b[:rnd.randrange(1,len(b))]
              add(f'{kind}-mut-{i:04d}',b)

          env=dict(os.environ)
          env['ASAN_OPTIONS']='abort_on_error=1:detect_leaks=0:symbolize=1'
          env['UBSAN_OPTIONS']='halt_on_error=1:print_stacktrace=1'
          summary=[]; hits=0; hangs=0
          for idx,(name,data) in enumerate(cases):
            p=ROOT/f'{idx:05d}-{name}.bin'; p.write_bytes(data)
            try:
              r=subprocess.run(['/tmp/filter_harness',str(p)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=.8)
            except subprocess.TimeoutExpired:
              hangs+=1; summary.append(f'HANG {p.name} bytes={len(data)}')
              continue
            err=r.stderr.decode('utf-8','replace')
            if ('AddressSanitizer' in err or 'UndefinedBehaviorSanitizer' in err or 'runtime error:' in err or r.returncode < 0):
              hits+=1
              shutil.copy2(p,HITS/p.name)
              (HITS/(p.name+'.stderr.txt')).write_text(err)
              summary.append(f'HIT {p.name} rc={r.returncode} bytes={len(data)}\n{err[:5000]}')
              if hits>=20: break
          summary.append(f'TOTAL={len(cases)} HITS={hits} HANGS={hangs}')
          pathlib.Path('/tmp/compression-summary.txt').write_text('\n\n'.join(summary))
          print('\n\n'.join(summary[-30:]))
          if hits: raise SystemExit(42)
          PY
          python /tmp/compression_hunt.py
      - name: Upload compression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarsnap-compression-hunt
          path: |
            /tmp/compression-summary.txt
            /tmp/compression-hits
          if-no-files-found: ignore
