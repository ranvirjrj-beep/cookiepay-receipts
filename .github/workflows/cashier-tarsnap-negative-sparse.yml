name: Cashier Tarsnap Negative Sparse Probe

on:
  push:
    branches: [cashier-tarsnap-lab]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang autoconf automake autoconf-archive pkg-config libssl-dev zlib1g-dev libext2fs-dev libbz2-dev liblzma-dev libacl1-dev libattr1-dev
      - name: Build Tarsnap libarchive with sanitizers
        run: |
          git clone --depth=1 https://github.com/Tarsnap/tarsnap.git tarsnap-src
          cd tarsnap-src
          autoreconf -i
          CC=clang CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined' ./configure --disable-dependency-tracking
          make -j2
      - name: Build deterministic probe
        working-directory: tarsnap-src
        run: |
          cat >/tmp/probe.c <<'EOF'
          #include <inttypes.h>
          #include <stdio.h>
          #include "archive.h"
          #include "archive_entry.h"
          int main(int argc, char **argv) {
            struct archive *a; struct archive_entry *e = NULL;
            const void *b = NULL; size_t sz = 0; off_t off = 0; int r;
            if (argc != 2) return 2;
            a = archive_read_new();
            archive_read_support_compression_none(a);
            archive_read_support_format_tar(a);
            r = archive_read_open_filename(a, argv[1], 10240);
            printf("open=%d\n", r);
            if (r != ARCHIVE_OK) return 0;
            r = archive_read_next_header(a, &e);
            printf("header=%d path=%s logical_size=%jd\n", r,
              e ? archive_entry_pathname(e) : "(null)",
              e ? (intmax_t)archive_entry_size(e) : (intmax_t)-999);
            if (r >= ARCHIVE_WARN) {
              r = archive_read_data_block(a, &b, &sz, &off);
              printf("data_block=%d size=%zu offset=%jd ptr=%p\n", r, sz, (intmax_t)off, b);
              if (r == ARCHIVE_OK && sz > 1024 * 1024)
                printf("IMPOSSIBLE_SIZE_RETURNED=%zu\n", sz);
              r = archive_read_data_block(a, &b, &sz, &off);
              printf("data_block_2=%d size=%zu offset=%jd ptr=%p\n", r, sz, (intmax_t)off, b);
            }
            archive_read_finish(a);
            return 0;
          }
          EOF
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ilibarchive /tmp/probe.c libarchive/libarchive.a -lz -lbz2 -llzma -o /tmp/probe
      - name: Generate malformed sparse archives and probe
        run: |
          cat >/tmp/make_cases.py <<'PY'
          from pathlib import Path
          def octal(v,n): return oct(v)[2:].encode().rjust(n-1,b'0')+b'\0'
          def hdr(name=b'x',size=0,typ=b'0'):
            h=bytearray(512); h[0:100]=name.ljust(100,b'\0'); h[100:108]=octal(0o644,8); h[108:116]=octal(0,8); h[116:124]=octal(0,8); h[124:136]=octal(size,12); h[136:148]=octal(0,12); h[148:156]=b'        '; h[156:157]=typ; h[257:263]=b'ustar\0'; h[263:265]=b'00'; s=sum(h); h[148:156]=oct(s)[2:].encode().rjust(6,b'0')+b'\0 '; return bytes(h)
          def pad(b): return b+b'\0'*((512-len(b)%512)%512)
          def rec(k,v):
            raw=k+b'='+v+b'\n'; n=len(raw)+3
            while True:
              x=str(n).encode()+b' '+raw
              if len(x)==n:return x
              n=len(x)
          def arc(numbytes, order='normal'):
            rs=[rec(b'GNU.sparse.numblocks',b'1')]
            if order=='normal': rs += [rec(b'GNU.sparse.offset',b'0'),rec(b'GNU.sparse.numbytes',numbytes)]
            else: rs += [rec(b'GNU.sparse.numbytes',numbytes),rec(b'GNU.sparse.offset',b'0')]
            rs += [rec(b'GNU.sparse.size',b'1'),rec(b'path',b'payload')]
            p=b''.join(rs)
            return hdr(b'PaxHeaders/x',len(p),b'x')+pad(p)+hdr(b'payload',1,b'0')+pad(b'A')+b'\0'*1024
          out=Path('/tmp/sparse-cases');out.mkdir(exist_ok=True)
          for val in [b'-2',b'-3',b'-9223372036854775807',b'0',b'1']:
            for order in ['normal','reverse']:
              (out/(val.decode().replace('-','neg')+'-'+order+'.tar')).write_bytes(arc(val,order))
          PY
          python /tmp/make_cases.py
          export ASAN_OPTIONS='abort_on_error=1:detect_leaks=0:symbolize=1'
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          : >/tmp/probe-results.txt
          for f in /tmp/sparse-cases/*.tar; do
            echo "===== $f =====" | tee -a /tmp/probe-results.txt
            timeout 5s /tmp/probe "$f" 2>&1 | tee -a /tmp/probe-results.txt || true
          done
          cat /tmp/probe-results.txt
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarsnap-negative-sparse-probe
          path: |
            /tmp/probe-results.txt
            /tmp/sparse-cases
          if-no-files-found: ignore
